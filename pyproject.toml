[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpfabric"
version = "1.0.0"
description = "Compile an OpenAPI document into a working MCP server"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Konain Sultan Khan", email = "kkdev9715@gmail.com"}]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcpfabric = "mcpfabric.cli:main"

[tool.setuptools.packages.find]
include = ["mcpfabric*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
